apiVersion: batch/v1
kind: Job
metadata:
  name: fast-cwdm-t2-flair-250k
  namespace: gai-lina-group
  labels:
    app: fast-cwdm
    pair: t2-flair
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: fast-cwdm
        pair: t2-flair
    spec:
      restartPolicy: Never

      # Run as root so the container can read PVC data regardless of file ownership.
      # If the namespace policy blocks runAsUser: 0, you will see an admission error
      # immediately (the pod will not start at all) -- report that to your advisor.
      securityContext:
        runAsUser: 0
        fsGroup: 0

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists

      containers:
        - name: trainer
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONIOENCODING
              value: "UTF-8"
            - name: WANDB_MODE
              value: "offline"

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              echo "=== Installing dependencies ==="
              pip install -q nibabel blobfile scikit-learn tqdm wandb

              echo "=== Cloning fast-cwdm repo ==="
              git clone https://github.com/tsereda/fast-cwdm.git /tmp/fast-cwdm
              cd /tmp/fast-cwdm

              echo "=== Checking GPU ==="
              python -c "
              import torch
              print(f'PyTorch  : {torch.__version__}')
              print(f'CUDA     : {torch.version.cuda}')
              print(f'GPU      : {torch.cuda.get_device_name(0)}')
              x = torch.rand(3,3).cuda() @ torch.rand(3,3).cuda()
              print(f'GPU test : OK {x.shape}')
              "

              echo "=== Data check ==="
              echo "Contents of /pvc/data/brats23/train (first 5):"
              ls /pvc/data/brats23/train | head -5
              echo "Total patient folders: $(ls /pvc/data/brats23/train | wc -l)"
              FIRST_DIR=$(ls /pvc/data/brats23/train | head -1)
              echo "First patient: $FIRST_DIR"
              ls -lh /pvc/data/brats23/train/$FIRST_DIR/ \
                || echo "WARNING: could not list patient folder -- continuing anyway"

              echo "=== Copying training script ==="
              cp /pvc/scripts/train_option2.py /tmp/fast-cwdm/train_option2.py

              echo "=== Starting Model 2: T2 <-> FLAIR ==="
              python /tmp/fast-cwdm/train_option2.py \
                --pair        T2_FLAIR \
                --resume      /pvc/checkpoints/t2_flair_full/checkpoint_t2_flair_iter0100000.pt \
                --iters       250000 \
                --lr          1e-5 \
                --num_channels 32 \
                --grad_accum  4 \
                --data_dir    /pvc/data/brats23/train \
                --save_dir    /pvc/checkpoints/t2_flair_250k \
                --repo_dir    /tmp/fast-cwdm \
                --log_every   100 \
                --val_every   5000 \
                --save_every  10000 \
                --num_workers 4

              echo "=== Job complete ==="
              ls -lah /pvc/checkpoints/

          volumeMounts:
            - name: brats23-vol
              mountPath: /pvc
            - name: shm
              mountPath: /dev/shm

          resources:
            requests:
              memory: "60Gi"
              cpu: "12"
              nvidia.com/gpu: "1"
            limits:
              memory: "64Gi"
              cpu: "12"
              nvidia.com/gpu: "1"

      volumes:
        - name: brats23-vol
          persistentVolumeClaim:
            claimName: brats23-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
