# nautilius/pvc-uploader-pod.yaml
# Utility pod for uploading data to the PVC.
#
#   kubectl apply -f nautilius/pvc-uploader-pod.yaml -n gai-lina-group
#   kubectl get pod brats23-uploader -n gai-lina-group -w   # wait for Running
#
# Copy data into PVC:
#   kubectl cp ./data/ gai-lina-group/brats23-uploader:/pvc/data/
#
# Delete when done:
#   kubectl delete pod brats23-uploader -n gai-lina-group
apiVersion: v1
kind: Pod
metadata:
  name: brats23-uploader
  namespace: gai-lina-group
spec:
  restartPolicy: Never
  containers:
    - name: uploader
      image: ubuntu:22.04
      command: ["bash", "-lc", "sleep infinity"]
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      volumeMounts:
        - name: brats23-vol
          mountPath: /pvc
  volumes:
    - name: brats23-vol
      persistentVolumeClaim:
        claimName: brats23-pvc
