# =============================================================================
# Evaluation Job — T2 <-> FLAIR
#
#   kubectl apply -f nautilius/jobs/evaluate-t2-flair.yaml -n gai-lina-group
#   kubectl logs -f job/bidi-mri-eval-t2-flair -n gai-lina-group
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: bidi-mri-eval-t2-flair
  namespace: gai-lina-group
  labels:
    app: bidirectional-mri-synthesis
    task: eval
    pair: t2-flair
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: bidirectional-mri-synthesis
        task: eval
        pair: t2-flair
    spec:
      restartPolicy: Never

      securityContext:
        runAsUser: 0
        fsGroup: 0

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A40
                - NVIDIA-GeForce-RTX-3090
                - Tesla-V100-SXM2-32GB

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists

      containers:
        - name: evaluator
          image: ghcr.io/amalsha27/bidirectional-mri-synthesis:latest
          imagePullPolicy: Always

          command: ["python", "/app/scripts/evaluate_option2.py"]
          args:
            - "--pair"
            - "T2_FLAIR"
            - "--checkpoint"
            - "/pvc/checkpoints/t2_flair_full/best_model_t2_flair.pt"
            - "--data_dir"
            - "/pvc/data/brats23/train"
            - "--save_dir"
            - "/pvc/results"
            - "--repo_dir"
            - "/app/fast-cwdm"
            - "--num_subjects"
            - "20"
            - "--ddim_steps"
            - "100"

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONIOENCODING
              value: "UTF-8"

          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: "18Gi"
              cpu: "4"
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: brats23-vol
              mountPath: /pvc
            - name: dshm
              mountPath: /dev/shm

      volumes:
        - name: brats23-vol
          persistentVolumeClaim:
            claimName: brats23-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
